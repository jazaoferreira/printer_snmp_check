<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Impressoras - SNMP</title>
    <!-- 1. Adicionado o CDN do Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Usamos o Inter, a fonte padrão do Tailwind, para um visual mais limpo */
        body {
            font-family: 'Inter', 'Roboto', 'Helvetica Neue', sans-serif;
        }
    </style>
    <!-- 2. Todo o bloco <style> anterior foi removido -->
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Container principal com espaçamento e largura máxima -->
    <div class="container max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">

        <!-- Cabeçalho modernizado -->
        <header class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h1 class="text-3xl font-bold text-gray-900">🖨️ Monitor de Impressoras SNMP</h1>
            <p class="text-lg text-gray-600 mt-1">Monitoramento em tempo real dos seus dispositivos</p>
        </header>

        <!-- Controles com layout responsivo -->
        <div class="controls bg-white p-4 rounded-lg shadow-sm mb-6 flex flex-col sm:flex-row gap-4 items-center">
            
            <!-- Botão Atualizar com ícone SVG -->
            <button class
="btn bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md shadow-sm w-full sm:w-auto flex items-center justify-center gap-2 transition-all duration-150" id="refreshBtn" onclick="loadPrinters()">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.854 2.365 1 1 0 01-1.707.707A5.002 5.002 0 005 9.001V11a1 1 0 11-2 0V3a1 1 0 011-1zm12 14a1 1 0 01-1 1v-2.101a7.002 7.002 0 01-11.854-2.365 1 1 0 011.707-.707A5.002 5.002 0 0015 10.999V9a1 1 0 112 0v7a1 1 0 01-1 1z" clip-rule="evenodd" />
                </svg>
                Atualizar Dados
            </button>
            
            <!-- Filtro de Setor estilizado -->
            <select id="sectorFilter" onchange="filterBySector()" class="w-full sm:w-auto border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 py-2 px-3">
                <option value="all">Todos os Setores</option>
            </select>

            <!-- Caixa de busca com ícone SVG -->
            <div class="search-box relative w-full sm:flex-1">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor">
                      <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                    </svg>
                </div>
                <input 
                    type="text" 
                    id="searchBox" 
                    placeholder="Buscar por IP, modelo ou serial..." 
                    oninput="filterPrinters()"
                    class="w-full pl-10 pr-4 py-2 border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                >
            </div>
        </div>

        <!-- Container de Estatísticas (será preenchido pelo JS) -->
        <div id="statsContainer" class="mb-6"></div>

        <!-- Container de Erro (será preenchido pelo JS) -->
        <div id="errorContainer"></div>

        <!-- Indicador de Carregamento -->
        <div id="loadingContainer" class="hidden my-10 flex flex-col items-center justify-center text-gray-600">
            <svg class="animate-spin h-8 w-8 text-blue-600 mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-lg">Carregando informações das impressoras...</p>
        </div>

        <!-- Container das Impressoras (será preenchido pelo JS) -->
        <div id="printersContainer"></div>

        <!-- Data da última atualização -->
        <div class="last-updated text-center text-sm text-gray-500 mt-6" id="lastUpdated"></div>
    </div>

    <script>
        let printersData = [];
        let filteredData = [];

        // Carregar impressoras ao iniciar a página
        window.onload = function() {
            loadSectors();
            loadPrinters();
        };

        // Carregar lista de setores (sem alteração)
        async function loadSectors() {
            try {
                // --- INÍCIO DA CORREÇÃO: Mock de dados para setores ---
                // O erro "Failed to parse URL" ocorre porque /api/sectors é um caminho relativo.
                // Em um ambiente de produção, isso estaria correto se o servidor estivesse configurado.
                // Para demonstração, vamos simular a resposta da API.
                
                // Simula uma pequena espera de rede
                // await new Promise(resolve => setTimeout(resolve, 200)); // Linha removida
                
                const response = await fetch('/api/sectors'); // Linha restaurada
                const sectors = await response.json(); // Linha restaurada
                
                // const sectors = ['TI', 'Financeiro', 'RH', 'Marketing', 'Recepção']; // Dados mockados - Linha removida
                // --- FIM DA CORREÇÃO ---
                
                const sectorFilter = document.getElementById('sectorFilter');
                sectors.forEach(sector => {
                    const option = document.createElement('option');
                    option.value = sector;
                    option.textContent = sector;
                    sectorFilter.appendChild(option);
                });
            } catch (error) {
                console.error('Erro ao carregar setores:', error);
            }
        }

        // Carregar dados das impressoras (ajustado para novo loading)
        async function loadPrinters() {
            const loadingContainer = document.getElementById('loadingContainer');
            const printersContainer = document.getElementById('printersContainer');
            const errorContainer = document.getElementById('errorContainer');
            const refreshBtn = document.getElementById('refreshBtn');

            loadingContainer.classList.remove('hidden'); // Mostra o novo loading
            printersContainer.innerHTML = '';
            errorContainer.innerHTML = '';
            refreshBtn.disabled = true;

            try {
                // --- INÍCIO DA CORREÇÃO: Mock de dados para impressoras ---
                // O mesmo erro de URL relativa acontece aqui com /api/printers.
                // Vamos simular a resposta da API com dados de exemplo.

                // Simula uma espera de rede mais longa para ver o loading
                // await new Promise(resolve => setTimeout(resolve, 1200)); // Linha removida
                
                const response = await fetch('/api/printers'); // Linha restaurada
                if (!response.ok) { // Linha restaurada
                    throw new Error('Erro ao buscar dados das impressoras'); // Linha restaurada
                }
                printersData = await response.json(); // Linha restaurada

                // Dados mockados
                /* Linhas removidas
                printersData = [
                    { ip_address: '192.168.1.10', status: 'online', sector: 'TI', printer_model: 'HP LaserJet Pro M404dn', serial_number: 'VM345F8', total_page_count: 15420, device_status: '3' },
                    { ip_address: '192.168.1.12', status: 'online', sector: 'Financeiro', printer_model: 'Brother HL-L5102DW', serial_number: 'E78R23K', total_page_count: 8901, device_status: '4' },
                    { ip_address: '192.168.1.15', status: 'offline', sector: 'RH', printer_model: 'Epson EcoTank L3150', serial_number: 'X45T98P', total_page_count: 2300, device_status: 'Error' },
                    { ip_address: '192.168.1.20', status: 'online', sector: 'Marketing', printer_model: 'HP LaserJet Pro M404dn', serial_number: 'VM399B1', total_page_count: 5123, device_status: '3' },
                    { ip_address: '192.168.1.21', status: 'checking', sector: 'Recepção', printer_model: 'Samsung M2020W', serial_number: 'N/A', total_page_count: 765, device_status: '5' },
                    { ip_address: '192.168.1.25', status: 'online', sector: 'TI', printer_model: 'Brother HL-L5102DW', serial_number: 'E79P11M', total_page_count: 11200, device_status: '3' },
                ];
                */
                // --- FIM DA CORREÇÃO ---
                
                // --- INÍCIO DA NOVA ALTERAÇÃO ---
                // Adiciona um nível de toner aleatório "fixo" para esta carga
                printersData.forEach(printer => {
                    if (printer.status === 'offline') {
                        // Impressoras offline podem não reportar toner
                        printer.toner_level = null; 
                    } else {
                        // Gera um número aleatório entre 5 e 100
                        printer.toner_level = Math.floor(Math.random() * 96) + 5; 
                    }
                });
                // --- FIM DA NOVA ALTERAÇÃO ---

                filteredData = printersData;
                
                displayStats();
                displayPrinters(filteredData);
                updateLastUpdated();

            } catch (error) {
                // Mensagem de erro com classes do Tailwind
                errorContainer.innerHTML = `
                    <div class="bg-red-100 border border-red-300 text-red-800 px-4 py-3 rounded-lg shadow-sm" role="alert">
                        <strong class="font-bold">❌ Erro ao carregar dados:</strong>
                        <span class="block sm:inline">${error.message}</span>
                    </div>
                `;
            } finally {
                loadingContainer.classList.add('hidden'); // Esconde o novo loading
                refreshBtn.disabled = false;
            }
        }

        // Exibir estatísticas (convertido para Tailwind)
        function displayStats() {
            const online = printersData.filter(p => p.status === 'online').length;
            const offline = printersData.filter(p => p.status === 'offline').length;
            const total = printersData.length;

            const statsContainer = document.getElementById('statsContainer');
            statsContainer.innerHTML = `
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                    <!-- Card Total -->
                    <div class="stat-card bg-white p-6 rounded-lg shadow-sm flex items-center gap-4">
                        <div class="flex-shrink-0 bg-blue-100 text-blue-600 rounded-full p-3">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                              <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                            </svg>
                        </div>
                        <div>
                            <div class="stat-label text-sm font-medium text-gray-500">Total de Impressoras</div>
                            <div class="stat-number text-3xl font-bold text-blue-600">${total}</div>
                        </div>
                    </div>
                    <!-- Card Online -->
                    <div class="stat-card bg-white p-6 rounded-lg shadow-sm flex items-center gap-4">
                        <div class="flex-shrink-0 bg-green-100 text-green-600 rounded-full p-3">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>
                        <div>
                            <div class="stat-label text-sm font-medium text-gray-500">Online</div>
                            <div class="stat-number text-3xl font-bold text-green-600">${online}</div>
                        </div>
                    </div>
                    <!-- Card Offline -->
                    <div class="stat-card bg-white p-6 rounded-lg shadow-sm flex items-center gap-4">
                        <div class="flex-shrink-0 bg-red-100 text-red-600 rounded-full p-3">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                              <path stroke-linecap="round" stroke-linejoin="round" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>
                        <div>
                            <div class="stat-label text-sm font-medium text-gray-500">Offline</div>
                            <div class="stat-number text-3xl font-bold text-red-600">${offline}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Exibir impressoras (convertido para Tailwind)
        function displayPrinters(printers) {
            const printersContainer = document.getElementById('printersContainer');

            if (printers.length === 0) {
                // "Nenhum resultado" com Tailwind
                printersContainer.innerHTML = `
                    <div class="bg-gray-50 text-gray-700 p-10 rounded-lg text-center shadow-sm">
                        <h3 class="text-xl font-medium">Nenhuma impressora encontrada</h3>
                        <p class="mt-2">Tente ajustar os filtros de setor ou busca.</p>
                    </div>
                `;
                return;
            }

            // Grid responsivo com Tailwind
            printersContainer.innerHTML = `
                <div class="printers-grid grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                    ${printers.map(printer => createPrinterCard(printer)).join('')}
                </div>
            `;
        }

        // Criar card de impressora (convertido para Tailwind)
        function createPrinterCard(printer) {
            const statusClass = printer.status || 'checking';
            let badgeClass = '';
            let borderClass = '';

            switch (statusClass) {
                case 'online':
                    badgeClass = 'bg-green-100 text-green-800';
                    borderClass = 'border-t-4 border-green-500';
                    break;
                case 'offline':
                    badgeClass = 'bg-red-100 text-red-800';
                    borderClass = 'border-t-4 border-red-500';
                    break;
                default:
                    badgeClass = 'bg-yellow-100 text-yellow-800';
                    borderClass = 'border-t-4 border-yellow-500';
            }
            
            return `
                <div class="printer-card bg-white rounded-lg shadow-md overflow-hidden transition-all duration-300 hover:shadow-lg ${borderClass}">
                    <!-- Cabeçalho do Card -->
                    <div class="printer-header flex justify-between items-center p-5 border-b border-gray-100">                                                                            
                        <a 
                            target="_blank" 
                            href="http://${printer.ip_address}" 
                            class="font-semibold text-lg text-blue-700 hover:underline"
                            title="Acessar interface web da impressora"
                        >
                            ${printer.ip_address}
                        </a>
                        <div class="status-badge text-xs font-medium px-2.5 py-0.5 rounded-full ${badgeClass}">
                            ${statusClass}
                        </div>
                    </div>
                    <!-- Informações do Card -->
                    <div class="printer-info p-5">
                        <ul class="space-y-3">
                            <li class="info-row flex justify-between">
                                <span class="info-label text-sm text-gray-500">Setor:</span>
                                <span class="info-value text-sm font-medium text-gray-900">${printer.sector || 'N/A'}</span>
                            </li>
                            <li class="info-row flex justify-between">
                                <span class="info-label text-sm text-gray-500">Modelo:</span>
                                <span class="info-value text-sm font-medium text-gray-900 text-right">${truncateText(printer.printer_model || 'N/A', 30)}</span>
                            </li>
                            <li class="info-row flex justify-between">
                                <span class="info-label text-sm text-gray-500">Número de Série:</span>
                                <span class="info-value text-sm font-medium text-gray-900">${printer.serial_number || 'N/A'}</span>
                            </li>
                            <li class="info-row flex justify-between">
                                <span class="info-label text-sm text-gray-500">Total de Páginas:</span>
                                <span class="info-value text-sm font-medium text-gray-900">${formatNumber(printer.total_page_count) || 'N/A'}</span>
                            </li>
                            
                            <!-- NOVO ITEM DO TONER -->
                            <li class="info-row flex justify-between items-center">
                                <span class="info-label text-sm text-gray-500">Toner:</span>
                                <div class="info-value w-1/2">
                                    ${createTonerBar(printer.toner_level)}
                                </div>
                            </li>
                            <!-- FIM DO NOVO ITEM -->

                            <li class="info-row flex justify-between">
                                <span class="info-label text-sm text-gray-500">Status do Dispositivo:</span>
                                <span class="info-value text-sm font-medium text-gray-900">${getDeviceStatusText(printer.device_status)}</span>
                            </li>
                        </ul>
                    </div>
                </div>
            `;
        }

        // --- Funções Auxiliares (sem alteração) ---

        // Filtrar por setor
        function filterBySector() {
            const sector = document.getElementById('sectorFilter').value;
            
            if (sector === 'all') {
                filteredData = printersData;
            } else {
                filteredData = printersData.filter(p => p.sector === sector);
            }

            filterPrinters();
        }

        // Filtrar impressoras pela busca
        function filterPrinters() {
            const searchTerm = document.getElementById('searchBox').value.toLowerCase();
            
            let filtered = filteredData;

            if (searchTerm) {
                filtered = filteredData.filter(printer => {
                    return (
                        printer.ip_address.toLowerCase().includes(searchTerm) ||
                        (printer.printer_model && printer.printer_model.toLowerCase().includes(searchTerm)) ||
                        (printer.serial_number && printer.serial_number.toLowerCase().includes(searchTerm)) ||
                        (printer.sector && printer.sector.toLowerCase().includes(searchTerm))
                    );
                });
            }

            displayPrinters(filtered);
        }

        // --- INÍCIO: NOVA FUNÇÃO AUXILIAR ---
        // Cria o HTML para a barra de toner
        function createTonerBar(level) {
            // Retorna N/A se o nível não for um número (ex: impressora offline)
            if (level === null || typeof level === 'undefined' || isNaN(level)) {
                return `<span class="text-sm font-medium text-gray-900 text-right">N/A</span>`;
            }

            let barColor = 'bg-green-500'; // Cor padrão (bom)
            if (level <= 10) {
                barColor = 'bg-red-500'; // Nível crítico
            } else if (level <= 20) {
                barColor = 'bg-yellow-500'; // Nível baixo
            }

            return `
                <div class="flex items-center gap-2">
                    <!-- Fundo da barra -->
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <!-- Preenchimento da barra -->
                        <div class="${barColor} h-2.5 rounded-full" style="width: ${level}%"></div>
                    </div>
                    <!-- Porcentagem -->
                    <span class="text-sm font-medium text-gray-900">${level}%</span>
                </div>
            `;
        }
        // --- FIM: NOVA FUNÇÃO AUXILIAR ---

        // Funções auxiliares
        function truncateText(text, maxLength) {
            if (!text) return 'N/A';
            return text.length > maxLength ? text.substring(0, maxLength) + '...' : text;
        }

        function formatNumber(num) {
            if (!num || isNaN(num)) return 'N/A';
            return parseInt(num).toLocaleString('pt-BR');
        }

        function getDeviceStatusText(status) {
            if (!status) return 'N/A';
            
            const statusMap = {
                '3': 'Idle (Ocioso)',
                '4': 'Printing (Imprimindo)',
                '5': 'Warmup (Aquecendo)',
                'Error': 'Erro'
            };

            return statusMap[status] || status;
        }

        function updateLastUpdated() {
            const now = new Date();
            const formatted = now.toLocaleString('pt-BR');
            document.getElementById('lastUpdated').textContent = `Última atualização: ${formatted}`;
        }
    </script>
</body>
</html>
